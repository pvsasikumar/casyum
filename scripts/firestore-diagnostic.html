<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Firestore Rules Diagnostic</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
    h1 { color: #fff; }
    .test { margin: 8px 0; padding: 8px; border-left: 3px solid #555; }
    .pass { border-left-color: #0f0; }
    .fail { border-left-color: #f00; background: #200; }
    .info { border-left-color: #ff0; background: #220; }
    pre { white-space: pre-wrap; word-break: break-all; margin: 4px 0 0 0; font-size: 13px; }
    button { background: #333; color: #fff; border: 1px solid #555; padding: 8px 16px;
             cursor: pointer; font-family: monospace; margin: 4px; }
    button:hover { background: #444; }
    #output { margin-top: 16px; }
    #status { color: #ff0; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Firestore Rules Diagnostic</h1>
  <p>This page runs 6 tests against the live Firestore database and prints exact errors.</p>
  <p><strong>DO NOT close this page during the test.</strong></p>
  <div id="status">Ready. Click "Run All Tests" to begin.</div>
  <div>
    <button onclick="runTests()">Run All Tests</button>
    <button onclick="document.getElementById('output').innerHTML=''">Clear</button>
  </div>
  <div id="output"></div>

  <!-- Firebase SDK v10+ (modular) via CDN -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import {
      getFirestore, doc, getDoc, collection, getDocs, query, limit
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    // ── Paste your REAL Firebase config here (from .env or Firebase Console) ──
    const firebaseConfig = {
      apiKey:            'AIzaSyBBS2iBLiv3owrHiRdbTm67q5VGtYx7sfI',
      authDomain:        'casyum-56aff.firebaseapp.com',
      projectId:         'casyum-56aff',
      storageBucket:     'casyum-56aff.firebasestorage.app',
      messagingSenderId: '930211460325',
      appId:             '1:930211460325:web:b0c439692de2f9f4a1100c',
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const log = (msg, cls = '') => {
      const el = document.getElementById('output');
      const d  = document.createElement('div');
      d.className = 'test ' + cls;
      d.innerHTML = `<pre>${msg}</pre>`;
      el.appendChild(d);
      d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };

    const setStatus = (msg) => { document.getElementById('status').textContent = msg; };

    async function runTest(name, fn) {
      setStatus('Running: ' + name + ' ...');
      try {
        const result = await fn();
        log(`[PASS] ${name}\n  → ${result}`, 'pass');
        return true;
      } catch (err) {
        const info = {
          name:      err.name || 'Error',
          code:      err.code || '(none)',
          message:   err.message || String(err),
          stack:     (err.stack || '').split('\n').slice(0, 3).join('\n'),
        };
        log(`[FAIL] ${name}\n  code:    ${info.code}\n  message: ${info.message}\n  type:    ${info.name}\n  trace:   ${info.stack}`, 'fail');
        return false;
      }
    }

    window.runTests = async function() {
      document.getElementById('output').innerHTML = '';
      setStatus('Waiting for auth...');

      const user = await new Promise((resolve) => {
        const unsub = onAuthStateChanged(auth, (u) => { unsub(); resolve(u); });
      });

      if (!user) {
        log('[ABORT] Not signed in. Sign in to Firebase Auth first.', 'fail');
        setStatus('Not signed in.');
        return;
      }

      log(`[INFO] Signed in as: uid=${user.uid}  email=${user.email}`, 'info');

      // ── TEST 1: Self-document read (getDoc) ──
      await runTest('Test 1: getDoc(doc(db, "users", YOUR_UID))', async () => {
        const snap = await getDoc(doc(db, 'users', user.uid));
        const data = snap.exists() ? snap.data() : null;
        return `exists=${snap.exists()}  role=${data?.role || '(no role field)'}  id=${snap.id}`;
      });

      // ── TEST 2: Users collection list ──
      await runTest('Test 2: getDocs(collection(db, "users"))', async () => {
        const snap = await getDocs(collection(db, 'users'));
        return `${snap.size} documents returned`;
      });

      // ── TEST 3: Participants collection list ──
      await runTest('Test 3: getDocs(collection(db, "participants"))', async () => {
        const snap = await getDocs(collection(db, 'participants'));
        return `${snap.size} documents returned`;
      });

      // ── TEST 4: Registrations collection list ──
      await runTest('Test 4: getDocs(collection(db, "registrations"))', async () => {
        const snap = await getDocs(collection(db, 'registrations'));
        return `${snap.size} documents returned`;
      });

      // ── TEST 5: Limited users query (smaller payload) ──
      await runTest('Test 5: getDocs(query(collection(db,"users"), limit(3)))', async () => {
        const snap = await getDocs(query(collection(db, 'users'), limit(3)));
        const ids = snap.docs.map(d => d.id);
        return `${snap.size} documents returned — ids: [${ids.join(', ')}]`;
      });

      // ── TEST 6: EventRegistrations collection list ──
      await runTest('Test 6: getDocs(collection(db, "eventRegistrations"))', async () => {
        const snap = await getDocs(collection(db, 'eventRegistrations'));
        return `${snap.size} documents returned`;
      });

      // ── TEST 7: Another user's document read ──
      await runTest('Test 7: getDoc(doc(db, "users", "NOT_YOUR_UID"))', async () => {
        const snap = await getDoc(doc(db, 'users', 'some-other-uid-that-does-not-exist'));
        return `exists=${snap.exists()}  (expected: false if doc does not exist)`;
      });

      // ── TEST 8: Settings doc read ──
      await runTest('Test 8: getDoc(doc(db, "settings", "app"))', async () => {
        const snap = await getDoc(doc(db, 'settings', 'app'));
        return `exists=${snap.exists()}`;
      });

      setStatus('All tests complete.');
      log('[INFO] Review the FAIL entries above. The exact error code and message identify the cause.', 'info');
    };
  </script>
</body>
</html>
